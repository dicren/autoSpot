version: 2

updates:
    # The version catalog is the single place where dependency versions live.
    - package-ecosystem: gradle
      directory: "/"
      schedule:
          interval: weekly
      open-pull-requests-limit: 5
      groups:
          androidx:
              patterns:
                  - "androidx.*"
          kotlin:
              patterns:
                  - "org.jetbrains.kotlin*"
                  - "com.google.devtools.ksp*"
          test:
              patterns:
                  - "junit*"
                  - "org.robolectric*"
                  - "app.cash.turbine*"
                  - "androidx.test*"
    - package-ecosystem: github-actions
      directory: "/"
      schedule:
          interval: weekly
      open-pull-requests-limit: 5
