name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, test and lint
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Check formatting
        run: ./gradlew spotlessCheck --configuration-cache

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --configuration-cache

      - name: Lint
        run: ./gradlew lintDebug lintVitalRelease --configuration-cache

      # Room writes the exported schemas during KSP. A schema change without the committed JSON
      # breaks MigrationTest on the next version bump, so fail here instead.
      - name: Check that Room schemas are committed
        run: |
          ./gradlew :app:kspDebugKotlin --configuration-cache
          git diff --exit-code -- app/schemas

      - name: Assemble debug
        run: ./gradlew assembleDebug --configuration-cache

      # R8 can strip something Room, Compose or Maps need; catch it here.
      - name: Assemble release
        run: ./gradlew assembleRelease bundleRelease --configuration-cache

      - name: Upload test and lint reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore
